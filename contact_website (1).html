
<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Henvendelse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
        }
        .hidden {
            display: none;
        }
        form {
            margin-top: 20px;
        }
        input, textarea, select {
            display: block;
            margin: 10px auto;
            padding: 8px;
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="showOptions()">Fiks en henvendelse</button>

        <div id="options" class="hidden">
            <p>Velg hvordan du vil ta kontakt:</p>
            <button onclick="alert('Ringer...')">Ring</button>
            <button onclick="showForm()">Send melding</button>
        </div>

        <!-- Skjema som sender til din e-post via Formsubmit -->
        <form id="messageForm" class="hidden" action="https://formsubmit.co/DITT@EPOST.NO" method="POST" enctype="multipart/form-data">
            <input type="text" name="navn" placeholder="Navn" required>
            <textarea name="beskrivelse" placeholder="Kort beskrivelse av hva du trenger hjelp med" required></textarea>
            <select name="størrelse" required>
                <option value="">Velg størrelse på jobben</option>
                <option value="liten">Liten</option>
                <option value="middels">Middels</option>
                <option value="stor">Stor</option>
            </select>
            <input type="file" name="media" accept="image/*,video/*" multiple>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        function showOptions() {
            document.getElementById('options').classList.remove('hidden');
        }

        function showForm() {
            document.getElementById('messageForm').classList.remove('hidden');
        }
    </script>
</body>
</html>
